<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Grid</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mb-5">
      <h1 class="display-4">Forms</h1>
      <form action="#knigga">
        <div class="form-row">
          <div class="form-group col-12 col-md-6">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
            />
          </div>
          <div class="form-group col-12 col-md-6">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Enter your password"
            />
          </div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            name="address"
            class="form-control"
            placeholder="Enter your address"
          />
        </div>
        <div class="form-row">
          <div class="form-group col-md-5">
            <label for="country">Country</label>
            <select class="form-control" name="country" id="country">
              <option value="bg">Bulgaria</option>
              <option value="jn">Japan</option>
              <option value="fr">France</option>
            </select>
          </div>
          <div class="form-group col-md-5">
            <label for="town">Town</label>
            <select class="form-control" name="town" id="town">
              <option value="sf">Sofia</option>
              <option value="pl">Plovdiv</option>
              <option value="vt">Veliko Tarnovo</option>
            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="zip">ZIP Code</label>
            <input class="form-control" type="text" name="zip" id="zip" />
          </div>
        </div>
        <div class="form-group custom-control custom-checkbox">
          <input
            type="checkbox"
            class="custom-control-input"
            id="customCheck"
            value="yes"
          />
          <label for="customCheck" class="custom-control-label">Sign Me</label>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
      integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
