<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Demo</title>
  </head>
  <body>
    <h1><b>Race Registration!</b></h1>
    <form action="">
      <div>
        <label for="fname">First Name</label>
        <input type="text" name="fname" id="fname" />
        <label for="lname">Last Name</label>
        <input type="text" name="lname" id="lname" />
      </div>
      <br />
      <div>
        <p>Select a Race:</p>
        <div>
          <input type="radio" name="race" id="fun" value="fun_run_5k" />
          <label for="fun">Fun Run 5k</label>
        </div>
        <div>
          <input type="radio" name="race" id="half" value="half_marathon" />
          <label for="half">Half Marathon</label>
        </div>
        <div>
          <input type="radio" name="race" id="full" value="full_marathon" />
          <label for="full">Full Marathon</label>
        </div>
      </div>
      <label for="email">Email</label>
      <input type="email" name="email" id="email" />
      <label for="password">Password</label>
      <input type="password" name="password" id="password" />
      <div>
        <label for="age_group">Select Age Group</label>
        <select name="age_group" id="age_group">
          <option name="age_group" value="under_18" selected>under 18</option>
          <option name="age_group" value="bwn_18_33">18-33</option>
          <option name="age_group" value="above_33">above 33</option>
        </select>
      </div>
      <button type="submit">Register!</button>
    </form>
  </body>
</html>
